{% extends 'core/base.html' %}
{% block title %}My Certificates{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">My Certificates</h1>
  <a href="" class="btn btn-primary btn-sm">+ New</a>
</div>
<div class="row g-3">
  {% for obj in certificates %}
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm"><div class="card-body">
      <a href="={{ obj.slug }}" class="text-decoration-none"><h6 class="mb-1">{{ obj.certificate_id }}</h6></a>
      <p class="small text-muted mb-0">{{ obj.description|default:''|truncatechars:80 }}</p>
    </div></div>
  </div>
  {% empty %}
  <div class="col-12"><div class="alert alert-info">Nothing here yet.</div></div>
  {% endfor %}
</div>
{% endblock %}
